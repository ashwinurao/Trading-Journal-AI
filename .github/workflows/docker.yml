name: Docker

# Fork CI (Ash, project thread, 2026-11-07): every pull request and every push to main
# runs the backend tests inside the Dockerfile's own Python and builds the image Unraid
# runs (which also builds the frontend). Upstream's ci.yml is left as it is, so upstream
# syncs stay easy (CLAUDE.md); it still runs the frontend tests.
# GitHub-hosted machines only: never add a self-hosted runner to this public repo, because
# a pull request from any fork could run code on it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests in python:3.11-slim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Dockerfile's API base image, so the tests see the same Python the server runs.
    container: python:3.11-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r backend/requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  image:
    name: Build the Unraid image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The same build Unraid runs with `docker compose up -d --build`: the frontend stage
      # (npm ci and npm run build on Node 24) and the API stage. Nothing is pushed.
      - name: Build image
        run: docker build --tag trading-journal-ai:ci .

      # The image loads the API as its own user, without a .env and without a network.
      - name: Import the API inside the image
        run: docker run --rm --network none trading-journal-ai:ci python -c "import server"
